<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宜蘭廠區專案管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF8;--surface:#fff;--border:#E8E5DF;--border-s:#C8C5BE;
  --text:#1A1A18;--muted:#6B6B68;--hint:#A8A8A5;
  --accent:#1F3864;--accent-l:#EEF2F8;--accent-t:#1F3864;
  --green:#2D5A3D;--green-l:#EAF2EC;
  --amber:#B8690A;--amber-l:#FEF3E2;
  --red:#C0392B;--red-l:#FBEAE8;
  --blue:#0369A1;--blue-l:#EFF8FF;
  --radius:10px;--radius-s:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.header{background:var(--accent);color:#fff;padding:14px 16px 10px;user-select:none}
.h-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.h-sub{font-size:11px;opacity:.7;margin-top:2px;display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;transition:background .3s}
.sync-dot.off{background:#fbbf24}
.sync-dot.err{background:#f87171}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:80px;padding:11px 8px 9px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.nav-btn .icon{font-size:18px;line-height:1}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center}
.content{padding:12px 14px;max-width:640px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-v{font-size:20px;font-weight:700}.stat-l{font-size:10px;color:var(--muted);margin-top:1px}
.wtabs{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;margin-bottom:10px;background:var(--surface)}
.wt{flex:1;padding:8px 6px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-right:1px solid var(--border);transition:background .12s}
.wt:last-child{border-right:none}
.wt.on{background:var(--accent);color:#fff}
.wt-sub{font-size:10px;opacity:.7}
.wt-n{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--red-l);color:var(--red);margin-top:1px;min-width:20px;text-align:center}
.wt.on .wt-n{background:rgba(255,255,255,.25);color:#fff}
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.vtog{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;background:var(--surface)}
.vb{font-size:12px;padding:4px 10px;border:none;background:none;font-family:inherit;cursor:pointer;color:var(--muted)}
.vb.on{background:var(--accent);color:#fff}
.tb{font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface);cursor:pointer;color:var(--muted);font-family:inherit}
.tb:hover{background:var(--bg)}
.sp{flex:1}
.clr-btn{font-size:11px;padding:3px 9px;border:1px solid var(--red);border-radius:var(--radius-s);background:none;cursor:pointer;color:var(--red);font-family:inherit}
.sec{margin-bottom:6px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sh{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--bg);cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
.sh:hover{background:#F0EDE8}
.sec-arr{font-size:10px;color:var(--hint);transition:transform .15s;flex-shrink:0}
.sec-arr.op{transform:rotate(90deg)}
.sec-t{font-size:13px;font-weight:700;color:var(--text);flex:1}
.sec-cnt{font-size:11px;color:var(--muted);background:var(--border);border-radius:20px;padding:1px 7px}
.sec-body{display:none;padding:5px 6px 6px}
.sec-body.op{display:block}
.card{border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:4px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.card.manual-card{border-left:3px solid var(--blue)}
.card-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;user-select:none}
.c-arr{font-size:9px;color:var(--hint);transition:transform .15s;flex-shrink:0}
.c-arr.op{transform:rotate(90deg)}
.nbadge{font-size:10px;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;font-weight:700;min-width:60px;text-align:center}
.nb-over{background:var(--red-l);color:var(--red)}
.nb-w1{background:var(--amber-l);color:var(--amber)}
.nb-w2{background:var(--blue-l);color:var(--blue)}
.nb-on{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.nb-done{background:var(--green-l);color:var(--green)}
.nb-new{background:var(--blue-l);color:var(--blue)}
.card-info{flex:1;min-width:0}
.card-title-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.c-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.c-num{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent-l);color:var(--accent-t);flex-shrink:0}
.c-status{font-size:10px;padding:1px 6px;border-radius:20px;flex-shrink:0;font-weight:500}
.c-saved{font-size:10px;color:var(--green);display:none;flex-shrink:0}
.card-btns{display:flex;gap:4px;flex-shrink:0}
.edit-btn{font-size:11px;padding:3px 8px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit}
.del-btn{font-size:11px;padding:3px 7px;border:1px solid var(--red);border-radius:var(--radius-s);background:none;cursor:pointer;color:var(--red);font-family:inherit}
.card-body{display:none;padding:0 10px 10px;border-top:1px solid var(--border)}
.card-body.op{display:block}
.fi{padding:7px 0 4px;font-size:12px;line-height:1.7}
.fi-row{display:flex;gap:6px;margin-bottom:2px}
.fi-label{color:var(--hint);white-space:nowrap;width:44px;flex-shrink:0}
.fi-val{color:var(--muted)}
.upd-box{background:var(--bg);border-radius:var(--radius-s);padding:5px 8px;font-size:11.5px;color:var(--muted);line-height:1.6;margin:3px 0;border:1px solid var(--border)}
.done-card{opacity:.4}.done-card .c-title{text-decoration:line-through}
.edit-area{background:var(--accent-l);border-radius:var(--radius-s);padding:9px 10px;margin-top:7px;border:1px solid #C8D8F0;display:none}
.edit-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.edit-label{font-size:11px;color:var(--muted);white-space:nowrap;width:46px;flex-shrink:0}
.edit-area select,.edit-area input,.edit-area textarea{font-size:12px;padding:5px 8px;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;background:#fff;color:var(--text);flex:1}
.edit-area textarea{resize:vertical;min-height:50px}
.save-btn{font-size:12px;padding:5px 14px;border:none;border-radius:var(--radius-s);background:var(--accent);color:#fff;cursor:pointer;font-weight:700;font-family:inherit}
.cancel-btn{font-size:12px;padding:5px 11px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit}
.add-panel{border:1px solid var(--blue);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.add-hdr{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--blue-l);cursor:pointer;user-select:none}
.add-hdr-t{font-size:13px;font-weight:700;color:var(--blue);flex:1}
.add-arr{font-size:11px;color:var(--blue);transition:transform .15s}
.add-body{display:none;padding:10px 12px;background:var(--surface)}
.add-body.op{display:block}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.add-grid.full{grid-template-columns:1fr}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;background:var(--bg);color:var(--text)}
.field textarea{resize:vertical;min-height:44px}
.add-footer{display:flex;align-items:center;gap:8px;margin-top:8px}
.add-btn{font-size:13px;padding:6px 18px;border:none;border-radius:var(--radius-s);background:var(--accent);color:#fff;cursor:pointer;font-weight:700;font-family:inherit}
.add-reset{font-size:12px;padding:5px 12px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit}
.add-msg{font-size:12px;color:var(--green);display:none;font-weight:500}
.mail-meta{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 12px;margin-bottom:10px;font-size:12px}
.m-row{display:flex;gap:8px;margin-bottom:3px}.m-row:last-child{margin-bottom:0}
.m-label{color:var(--hint);white-space:nowrap;font-weight:500}
.m-val{color:var(--text);font-weight:600}
.mail-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.mail-header-bar{background:var(--bg);padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border)}
.mail-body{padding:14px 16px;font-size:12.5px;line-height:1.9;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:500px;overflow-y:auto;background:#fff;font-family:'Noto Sans TC',sans-serif}
.exp-info{background:var(--amber-l);border:1px solid #E8C380;border-radius:var(--radius-s);padding:10px 12px;font-size:12.5px;color:#7A4500;margin-bottom:10px;line-height:1.65}
.exp-data{font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:240px;overflow-y:auto;background:#1E1E1E;padding:10px;border-radius:var(--radius-s);color:#9CDCFE;line-height:1.6;margin-top:8px;display:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-p{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-s);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn-p:active{opacity:.85}
.btn-s{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;background:#fff;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.note{font-size:11px;color:var(--hint);margin-top:6px;line-height:1.55}
.prog{font-size:11.5px;color:var(--muted);margin-top:6px}
.empty{text-align:center;padding:32px 16px;color:var(--hint);font-size:13px}
.loading-box{text-align:center;padding:40px 16px;color:var(--hint)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.update-badge{background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;margin-left:5px}
</style>
</head>
<body>

<div class="header">
  <div class="h-title">
    <span class="sync-dot" id="syn-dot"></span>
    🏭 宜蘭廠區專案管理
  </div>
  <div class="h-sub">
    <span id="syn-txt">載入中...</span>
    <span id="last-update"></span>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-board" onclick="swTab('board')">
    <span class="icon">📋</span>
    <span>工作看板</span>
    <span class="nav-badge" id="badge-board">—</span>
  </button>
  <button class="nav-btn" id="nav-mail" onclick="swTab('mail')">
    <span class="icon">📧</span>
    <span>週報郵件</span>
  </button>
  <button class="nav-btn" id="nav-export" onclick="swTab('export')">
    <span class="icon">📤</span>
    <span>產出更新</span>
    <span class="nav-badge" id="badge-export" style="display:none">—</span>
  </button>
</div>

<!-- 看板 -->
<div id="tab-board" class="content">
  <div class="stats">
    <div class="stat"><div class="stat-v" id="s-over" style="color:var(--red)">—</div><div class="stat-l">逾期</div></div>
    <div class="stat"><div class="stat-v" id="s-week" style="color:var(--amber)">—</div><div class="stat-l" id="s-week-l">本週</div></div>
    <div class="stat"><div class="stat-v" id="s-done" style="color:var(--green)">—</div><div class="stat-l">已完成</div></div>
    <div class="stat"><div class="stat-v" id="s-upd">—</div><div class="stat-l">已更新</div></div>
  </div>
  <div class="wtabs">
    <button class="wt on" id="wt-1" onclick="swWeek(1)">第一週<span class="wt-sub" id="wt-sub-1">—</span><span class="wt-n" id="wn-1">—</span></button>
    <button class="wt" id="wt-2" onclick="swWeek(2)">第二週<span class="wt-sub" id="wt-sub-2">—</span><span class="wt-n" id="wn-2">—</span></button>
    <button class="wt" id="wt-0" onclick="swWeek(0)">持續推進<span class="wt-sub">6/7以後</span><span class="wt-n" id="wn-0">—</span></button>
  </div>
  <div class="add-panel">
    <div class="add-hdr" onclick="togAdd()">
      <span style="font-size:16px">➕</span>
      <span class="add-hdr-t">手動新增任務</span>
      <span class="add-arr" id="add-arr">▶</span>
    </div>
    <div class="add-body" id="add-body">
      <div class="add-grid">
        <div class="field"><label>部門 *</label><select id="af-dept"><option value="">選擇</option><option>創新中心</option><option>設備課</option><option>生產部</option><option>研發部</option><option>廠務課</option><option>管理部</option><option>董事長室</option></select></div>
        <div class="field"><label>分類</label><input type="text" id="af-cat" placeholder="例：TNA裝機"></div>
      </div>
      <div class="add-grid full"><div class="field"><label>任務描述 *</label><input type="text" id="af-desc" placeholder="簡要描述任務內容"></div></div>
      <div class="add-grid">
        <div class="field"><label>負責人</label><input type="text" id="af-owner" placeholder="例：Louis"></div>
        <div class="field"><label>到期日</label><input type="text" id="af-due" placeholder="M/D，例如 6/6"></div>
      </div>
      <div class="add-grid">
        <div class="field"><label>狀態</label><select id="af-status"><option>尚未開始</option><option>進行中</option><option>已完成</option><option>已暫緩</option></select></div>
        <div class="field"><label>顯示週次</label><select id="af-wk"><option value="1">第一週</option><option value="2">第二週</option><option value="0">持續推進</option></select></div>
      </div>
      <div class="add-grid full"><div class="field"><label>初始說明（選填）</label><textarea id="af-upd" placeholder="填入初始進度說明..."></textarea></div></div>
      <div class="add-footer">
        <button class="add-btn" onclick="addItem()">新增</button>
        <button class="add-reset" onclick="resetForm()">清空</button>
        <span class="add-msg" id="af-msg">✓ 已新增並儲存</span>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <div class="vtog">
      <button class="vb on" id="vb-c" onclick="setView('c')">精簡</button>
      <button class="vb" id="vb-f" onclick="setView('f')">完整</button>
    </div>
    <button class="tb" onclick="colAll()">全部收合</button>
    <button class="tb" onclick="expAll()">全部展開</button>
    <div class="sp"></div>
    <button class="clr-btn" onclick="clearUpdates()">清除更新</button>
  </div>
  <div id="board-content">
    <div class="loading-box"><div class="loading-spinner"></div><div>從 Firebase 載入任務中...</div></div>
  </div>
  <div style="margin-top:10px">
    <button class="btn-p" onclick="doExport()">📤 產出更新控管表</button>
  </div>
  <div class="exp-data" id="board-exp"></div>
</div>

<!-- 週報 -->
<div id="tab-mail" class="content" style="display:none">
  <div class="mail-meta">
    <div class="m-row"><span class="m-label">收件人</span><span class="m-val" id="mail-to">—</span></div>
    <div class="m-row"><span class="m-label">主旨</span><span class="m-val" id="mail-subj">—</span></div>
    <div class="m-row"><span class="m-label">週期</span><span class="m-val" id="mail-period">—</span></div>
  </div>
  <div class="mail-wrap">
    <div class="mail-header-bar">📄 郵件內文</div>
    <div class="mail-body" id="mail-body">載入中...</div>
  </div>
  <div class="btn-row">
    <button class="btn-p" onclick="openMail()">✉️ 開啟郵件寄送</button>
    <button class="btn-s" id="cp-btn" onclick="cpMail()">📋 複製內容</button>
  </div>
  <div class="note">點「開啟郵件寄送」自動帶入收件人、主旨與完整內文，確認後直接送出即可</div>
</div>

<!-- 產出 -->
<div id="tab-export" class="content" style="display:none">
  <div class="exp-info">
    📌 將看板上填寫的進度更新整理成可直接貼給 Claude 的格式。<br>
    Claude 收到後會自動更新 Excel 控管表並同步寫回 Firebase，網頁下次開啟即自動更新。
  </div>
  <div class="btn-row">
    <button class="btn-p" onclick="doExport2()">📋 產出並複製給 Claude</button>
    <button class="btn-s" onclick="swTab('board')">← 回到看板</button>
  </div>
  <div class="exp-data" id="exp-out"></div>
  <div class="prog" id="exp-prog"></div>
</div>

<script>
// ── Firebase REST ──────────────────────────────────────
const FB = 'https://evaluation-survey-form-default-rtdb.firebaseio.com';
const TASKS_PATH  = 'dashboard/louis/tasks';   // Claude 寫入任務清單
const CHANGES_PATH = 'dashboard/louis/changes'; // 進度更新
const MANUALS_PATH = 'dashboard/louis/manuals'; // 手動新增
const META_PATH   = 'dashboard/louis/meta';    // 週報設定、週次標題等

async function fbGet(p){
  try{ const r=await fetch(`${FB}/${p}.json`); if(!r.ok) return null; return r.json(); }
  catch(e){ return null; }
}
async function fbSet(p,v){
  try{ await fetch(`${FB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}); return true; }
  catch(e){ return false; }
}

// ── 設定 ──────────────────────────────────────────────
const SOPT=['進行中','尚未開始','已完成','已暫緩'];
const SBG={進行中:'var(--amber-l)',尚未開始:'var(--blue-l)',已完成:'var(--green-l)',已暫緩:'var(--red-l)'};
const SCO={進行中:'var(--amber)',尚未開始:'var(--blue)',已完成:'var(--green)',已暫緩:'var(--red)'};
const TNA=['TNA 賠償','TNA 採購','TNA 裝機','TNA裝機','Tna UK 訪廠','TNA設備'];
const AUTO=['自動化規劃','PLC自動化'];
const BPA=['BPA自動裝箱規劃','外包裝規劃'];

// ── 狀態 ──────────────────────────────────────────────
let BASE=[], CH={}, MN=[], META={}, curTab='board', curWeek=1, viewMode='c', addOpen=false;
let TODAY_STR='', EMAIL_BODY='', W1_LABEL='', W2_LABEL='';

function IT(){ return [...BASE, ...MN]; }
function ST(i){ return CH[i.row]?.status || i.status; }
function DU(i){ return CH[i.row]?.due || i.due; }
function UP(i){
  const c=CH[i.row]||{};
  const b=i.update?i.update.split('\n').filter(Boolean):[];
  return [...b,...(c.updateLines||[])].join('<br>');
}

// ── Section 定義（動態，根據 META 設定）──────────────
function getSecs(week){
  if(week===1) return [
    {id:'w1ov',lb:'🔴 逾期未完成',f:i=>i.p==='over'&&ST(i)!=='已完成'},
    {id:'w1tn',lb:'🔧 TNA & 平台',f:i=>i.p==='week1'&&[...TNA,'Tna UK 訪廠'].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w1au',lb:'⚙️ 自動化 & PLC',f:i=>i.p==='week1'&&AUTO.includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w1bp',lb:'📦 BPA 包裝自動化',f:i=>i.p==='week1'&&BPA.includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w1eq',lb:'🏭 設備 & 生產 & 合約',f:i=>i.p==='week1'&&![...TNA,'Tna UK 訪廠',...AUTO,...BPA].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w1mn',lb:'🔖 手動新增',f:i=>i.manual&&i.week===1&&ST(i)!=='已完成'},
    {id:'w1dn',lb:'✅ 已完成',f:i=>i.week===1&&ST(i)==='已完成'},
  ];
  if(week===2) return [
    {id:'w2tn',lb:'🔧 TNA & 平台',f:i=>i.p==='week2'&&[...TNA,'Tna UK 訪廠','TNA 裝機'].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w2au',lb:'⚙️ 自動化 & PLC',f:i=>i.p==='week2'&&AUTO.includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w2pr',lb:'🏭 生產 & 設備 & 研發',f:i=>i.p==='week2'&&![...TNA,'Tna UK 訪廠','TNA 裝機',...AUTO,...BPA].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w2bp',lb:'📦 包裝自動化',f:i=>i.p==='week2'&&BPA.includes(i.cat)&&ST(i)!=='已完成'},
    {id:'w2mn',lb:'🔖 手動新增',f:i=>i.manual&&i.week===2&&ST(i)!=='已完成'},
    {id:'w2dn',lb:'✅ 已完成',f:i=>i.week===2&&ST(i)==='已完成'},
  ];
  return [
    {id:'on-au',lb:'⚙️ 自動化 & TNA',f:i=>i.p==='on'&&[...AUTO,...TNA,'Tna UK 訪廠'].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'on-pr',lb:'🏭 產能 & 設備',f:i=>i.p==='on'&&['產能提升','設備管理','製程優化','新設備開發'].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'on-bp',lb:'📦 包裝自動化',f:i=>i.p==='on'&&BPA.includes(i.cat)&&ST(i)!=='已完成'},
    {id:'on-rd',lb:'🧪 研發 & 新品',f:i=>i.p==='on'&&['新品開發'].includes(i.cat)&&ST(i)!=='已完成'},
    {id:'on-ot',lb:'📂 其他',f:i=>i.p==='on'&&!([...AUTO,...TNA,'Tna UK 訪廠',...BPA,'產能提升','設備管理','製程優化','新設備開發','新品開發'].includes(i.cat))&&ST(i)!=='已完成'},
    {id:'on-mn',lb:'🔖 手動新增',f:i=>i.manual&&i.week==0&&ST(i)!=='已完成'},
  ];
}

function badge(i){
  const s=ST(i),d=DU(i);
  if(s==='已完成') return `<span class="nbadge nb-done">✓ 完成</span>`;
  if(i.manual) return `<span class="nbadge nb-new">新 ${d}</span>`;
  if(i.p==='over') return `<span class="nbadge nb-over">逾期 ${d}</span>`;
  if(i.p==='week1') return `<span class="nbadge nb-w1">${d}</span>`;
  if(i.p==='week2') return `<span class="nbadge nb-w2">${d}</span>`;
  return `<span class="nbadge nb-on">${d}</span>`;
}

function cardHTML(i){
  const s=ST(i),d=DU(i),done=s==='已完成',u=UP(i);
  return `<div class="card${done?' done-card':''}${i.manual?' manual-card':''}" id="c-${i.row}">
    <div class="card-hdr" onclick="togCard(${JSON.stringify(i.row)})">
      <span class="c-arr op" id="ca-${i.row}">▶</span>
      ${badge(i)}
      <div class="card-info">
        <div class="card-title-row">
          <span class="c-title">${i.desc}</span>
          <span class="c-num">${i.num}</span>
          <span class="c-status" id="cs-${i.row}" style="background:${SBG[s]};color:${SCO[s]}">${s}</span>
          <span class="c-saved" id="sv-${i.row}">✓已儲存</span>
        </div>
      </div>
      <div class="card-btns">
        <button class="edit-btn" onclick="event.stopPropagation();openEdit(${JSON.stringify(i.row)})">編輯</button>
        ${i.manual?`<button class="del-btn" onclick="event.stopPropagation();delManual(${JSON.stringify(i.row)})">✕</button>`:''}
      </div>
    </div>
    <div class="card-body op" id="cb-${i.row}">
      <div class="fi">
        <div class="fi-row"><span class="fi-label">負責人</span><span class="fi-val">${i.owner||'—'}</span></div>
        <div class="fi-row"><span class="fi-label">到期日</span><span class="fi-val" id="fd-${i.row}">${d}</span></div>
        ${u?`<div class="fi-row"><span class="fi-label">進度</span><span></span></div><div class="upd-box" id="fu-${i.row}">${u}</div>`:`<div class="upd-box" id="fu-${i.row}" style="display:none"></div>`}
      </div>
      <div class="edit-area" id="ea-${i.row}">
        <div class="edit-row"><span class="edit-label">狀態</span><select id="es-${i.row}">${SOPT.map(o=>`<option${s===o?' selected':''}>${o}</option>`).join('')}</select></div>
        <div class="edit-row"><span class="edit-label">到期日</span><input type="text" id="ed-${i.row}" value="${d}" placeholder="M/D"></div>
        <div class="edit-row" style="align-items:flex-start"><span class="edit-label" style="margin-top:5px">更新說明</span><textarea id="eu-${i.row}" placeholder="填入本次進度說明（自動加日期）..."></textarea></div>
        <div style="display:flex;gap:6px;margin-top:5px">
          <button class="save-btn" onclick="saveItem(${JSON.stringify(i.row)})">儲存</button>
          <button class="cancel-btn" onclick="closeEdit(${JSON.stringify(i.row)})">取消</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderBoard(){
  const secs=getSecs(curWeek);
  let h='';
  for(const s of secs){
    const items=IT().filter(s.f);
    if(!items.length) continue;
    h+=`<div class="sec"><div class="sh" onclick="togSec('${s.id}')"><span class="sec-arr op" id="sa-${s.id}">▶</span><span class="sec-t">${s.lb}</span><span class="sec-cnt">${items.length} 項</span></div><div class="sec-body op" id="sb-${s.id}">${items.map(cardHTML).join('')}</div></div>`;
  }
  document.getElementById('board-content').innerHTML = h || '<div class="empty">此週無待辦項目</div>';
  applyView();
  upStats();
  Object.keys(CH).forEach(r=>{
    const el=document.getElementById('sv-'+r); if(el) el.style.display='inline';
  });
}

function togSec(id){ const b=document.getElementById('sb-'+id),a=document.getElementById('sa-'+id); if(!b)return; const op=b.classList.toggle('op'); a.classList.toggle('op',op); }
function togCard(r){ const b=document.getElementById('cb-'+r),a=document.getElementById('ca-'+r); if(!b)return; const op=b.classList.toggle('op'); a.classList.toggle('op',op); }
function openEdit(r){ document.getElementById('cb-'+r)?.classList.add('op'); document.getElementById('ca-'+r)?.classList.add('op'); document.getElementById('ea-'+r).style.display='block'; document.getElementById('c-'+r)?.classList.add('editing'); document.getElementById('eu-'+r)?.focus(); }
function closeEdit(r){ document.getElementById('ea-'+r).style.display='none'; document.getElementById('c-'+r)?.classList.remove('editing'); }

async function saveItem(r){
  const i=IT().find(x=>x.row==r); if(!i) return;
  const ns=document.getElementById('es-'+r).value;
  const nd=document.getElementById('ed-'+r).value.trim();
  const nu=document.getElementById('eu-'+r).value.trim();
  if(!nu&&ns===ST(i)&&nd===DU(i)){ closeEdit(r); return; }
  const c=CH[r]||{updateLines:[]};
  if(ns!==i.status) c.status=ns;
  if(nd!==i.due) c.due=nd;
  if(nu){
    const n=(i.update?i.update.split('\n').filter(Boolean):[]).length+(c.updateLines||[]).length+1;
    c.updateLines=[...(c.updateLines||[]),`${n}.${TODAY_STR} ${nu}`];
  }
  c.num=i.num; c.desc=i.desc; c.origStatus=i.status; c.origDue=i.due;
  CH[r]=c;
  setSyn('sv');
  await fbSet(CHANGES_PATH, CH);
  setSyn('ok');
  const cs=document.getElementById('cs-'+r); if(cs){cs.style.background=SBG[ns];cs.style.color=SCO[ns];cs.textContent=ns;}
  const fd=document.getElementById('fd-'+r); if(fd) fd.textContent=nd;
  const fu=document.getElementById('fu-'+r); if(fu){fu.innerHTML=UP(i);fu.style.display='block';}
  const sv=document.getElementById('sv-'+r); if(sv) sv.style.display='inline';
  document.getElementById('c-'+r)?.classList.toggle('done-card',ns==='已完成');
  document.getElementById('eu-'+r).value='';
  closeEdit(r);
  upStats();
}

function setView(m){ viewMode=m; document.getElementById('vb-c')?.classList.toggle('on',m==='c'); document.getElementById('vb-f')?.classList.toggle('on',m==='f'); applyView(); }
function applyView(){
  IT().forEach(i=>{
    const b=document.getElementById('cb-'+i.row),a=document.getElementById('ca-'+i.row); if(!b||!a) return;
    const eo=document.getElementById('ea-'+i.row)?.style.display==='block';
    if(viewMode==='c'&&!eo){b.classList.remove('op');a.classList.remove('op');}
    else{b.classList.add('op');a.classList.add('op');}
  });
}
function colAll(){ document.querySelectorAll('.card-body').forEach(e=>e.classList.remove('op')); document.querySelectorAll('.c-arr').forEach(e=>e.classList.remove('op')); }
function expAll(){ document.querySelectorAll('.card-body').forEach(e=>e.classList.add('op')); document.querySelectorAll('.c-arr').forEach(e=>e.classList.add('op')); }

function swWeek(w){
  curWeek=w;
  [0,1,2].forEach(n=>document.getElementById('wt-'+n)?.classList.toggle('on',n===w));
  renderBoard();
}

function togAdd(){ addOpen=!addOpen; document.getElementById('add-body')?.classList.toggle('op',addOpen); const a=document.getElementById('add-arr'); if(a)a.style.transform=addOpen?'rotate(90deg)':''; }
function resetForm(){ ['af-dept','af-cat','af-desc','af-owner','af-due','af-upd'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';}); document.getElementById('af-status').value='尚未開始'; document.getElementById('af-wk').value='1'; }

async function addItem(){
  const dept=document.getElementById('af-dept')?.value;
  const desc=document.getElementById('af-desc')?.value.trim();
  if(!dept||!desc){alert('請填寫部門與任務描述');return;}
  const wk=parseInt(document.getElementById('af-wk')?.value||'1');
  const pm={1:'week1',2:'week2',0:'on'};
  const it={row:'M'+Date.now(),num:dept+'-新',cat:document.getElementById('af-cat')?.value.trim()||'其他',desc,owner:document.getElementById('af-owner')?.value.trim()||'—',due:document.getElementById('af-due')?.value.trim()||'—',status:document.getElementById('af-status')?.value||'尚未開始',week:wk,p:pm[wk],update:document.getElementById('af-upd')?.value.trim()||'',manual:true};
  MN.push(it);
  setSyn('sv');
  await fbSet(MANUALS_PATH, MN);
  setSyn('ok');
  renderBoard();
  const m=document.getElementById('af-msg'); if(m){m.style.display='inline';setTimeout(()=>m.style.display='none',2500);}
  resetForm();
}

async function delManual(r){
  if(!confirm('確定刪除？'))return;
  MN=MN.filter(i=>i.row!==r); delete CH[r];
  setSyn('sv');
  await Promise.all([fbSet(MANUALS_PATH,MN), fbSet(CHANGES_PATH,CH)]);
  setSyn('ok');
  renderBoard();
}

function upStats(){
  const all=IT(), nc=Object.keys(CH).length;
  const over=all.filter(i=>i.p==='over'&&ST(i)!=='已完成').length;
  const w1=all.filter(i=>i.p==='week1'&&ST(i)!=='已完成').length;
  const w2=all.filter(i=>i.p==='week2'&&ST(i)!=='已完成').length;
  const on=all.filter(i=>i.p==='on'&&ST(i)!=='已完成').length;
  const done=all.filter(i=>ST(i)==='已完成').length;
  document.getElementById('s-over').textContent=over;
  document.getElementById('s-week').textContent=curWeek===1?w1:curWeek===2?w2:on;
  document.getElementById('s-week-l').textContent=curWeek===0?'推進中':'本週';
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-upd').textContent=nc;
  document.getElementById('badge-board').textContent=(over+w1);
  const b3=document.getElementById('badge-export'); if(b3){b3.textContent=nc;b3.style.display=nc>0?'inline-block':'none';}
  document.getElementById('wn-1').textContent=over+w1;
  document.getElementById('wn-2').textContent=w2;
  document.getElementById('wn-0').textContent=on;
}

function swTab(t){
  curTab=t;
  ['board','mail','export'].forEach(n=>{
    document.getElementById('tab-'+n).style.display=n===t?'block':'none';
    document.getElementById('nav-'+n)?.classList.toggle('active',n===t);
  });
  if(t==='board') renderBoard();
  if(t==='mail') loadMail();
}

async function clearUpdates(){
  if(!confirm('確定清除所有進度更新？手動新增項目不受影響。'))return;
  CH={};
  setSyn('sv');
  await fbSet(CHANGES_PATH,{});
  setSyn('ok');
  renderBoard();
}

// ── 週報（從 Firebase META 讀取）────────────────────────
function loadMail(){
  if(META.email){
    document.getElementById('mail-to').textContent = META.email.to || '—';
    document.getElementById('mail-subj').textContent = META.email.subject || '—';
    document.getElementById('mail-period').textContent = META.email.period || '—';
    document.getElementById('mail-body').textContent = META.email.body || '（尚未產出週報，請在 Claude 對話中產出後同步）';
    EMAIL_BODY = META.email.body || '';
  } else {
    document.getElementById('mail-body').textContent = '（尚未產出週報，請在 Claude 對話中產出後同步到 Firebase）';
  }
}

function openMail(){
  if(!EMAIL_BODY){alert('尚未載入週報內容');return;}
  const s=META.email?.subject||'【週報】宜蘭廠區工作進度彙報 — Louis Lin';
  const to=META.email?.toEmail||'danny@bfycorp.com';
  const cc=META.email?.ccEmail||'yumingda@bfycorp.com';
  window.open(`mailto:${to}?cc=${encodeURIComponent(cc)}&subject=${encodeURIComponent(s)}&body=${encodeURIComponent(EMAIL_BODY)}`);
}
function cpMail(){
  if(!EMAIL_BODY){alert('尚未載入週報內容');return;}
  navigator.clipboard.writeText(EMAIL_BODY).then(()=>{
    const b=document.getElementById('cp-btn'); b.textContent='✓ 已複製'; setTimeout(()=>b.textContent='📋 複製內容',2000);
  });
}

// ── 匯出 ──────────────────────────────────────────────
function buildExpText(){
  const nc=Object.keys(CH).length, nm=MN.length;
  if(!nc&&!nm) return null;
  let L=['請根據以下內容，更新控管表：\n'];
  if(nc){
    L.push('=== 進度更新 ===');
    for(const [r,c] of Object.entries(CH)){
      const i=IT().find(x=>x.row==r); if(!i) continue;
      L.push(`【${i.num}】${i.desc}`);
      if(c.status&&c.status!==i.status) L.push(`  狀態：${i.status} → ${c.status}`);
      if(c.due&&c.due!==i.due) L.push(`  到期日：${i.due} → ${c.due}`);
      (c.updateLines||[]).forEach(l=>L.push(`  ${l}`));
      L.push('');
    }
  }
  if(nm){
    L.push('=== 手動新增項目 ===');
    MN.forEach(i=>{
      L.push(`部門：${i.dept} ｜ 分類：${i.cat} ｜ 描述：${i.desc}`);
      L.push(`負責人：${i.owner} ｜ 到期日：${i.due} ｜ 狀態：${ST(i)}`);
      if(i.update) L.push(`進度：${i.update}`);
      L.push('');
    });
  }
  return L.join('\n');
}

function doExport(){
  const txt=buildExpText(); if(!txt){alert('尚未填寫任何更新');return;}
  const el=document.getElementById('board-exp'); el.textContent=txt; el.style.display='block';
  navigator.clipboard.writeText(txt).then(()=>alert('✓ 已複製！請貼回 Claude 對話視窗'));
}
function doExport2(){
  const txt=buildExpText(); if(!txt){alert('尚未填寫任何更新，請先到看板填寫進度');return;}
  const el=document.getElementById('exp-out'); el.textContent=txt; el.style.display='block';
  navigator.clipboard.writeText(txt).then(()=>{
    document.getElementById('exp-prog').textContent='✓ 已複製！請貼回 Claude 對話視窗，Claude 會自動更新 Excel 並同步回 Firebase';
  });
}

// ── 同步狀態 ──────────────────────────────────────────
function setSyn(state){
  const dot=document.getElementById('syn-dot');
  const txt=document.getElementById('syn-txt');
  if(state==='ok'){dot.className='sync-dot';txt.textContent='已同步';}
  else if(state==='sv'){dot.className='sync-dot off';txt.textContent='同步中...';}
  else{dot.className='sync-dot err';txt.textContent='同步失敗，請重新整理';}
}

// ── 初始化：從 Firebase 載入所有資料 ──────────────────
async function init(){
  setSyn('sv');
  try{
    const [tasks, changes, manuals, meta] = await Promise.all([
      fbGet(TASKS_PATH),
      fbGet(CHANGES_PATH),
      fbGet(MANUALS_PATH),
      fbGet(META_PATH),
    ]);

    // 任務清單（BASE）
    if(tasks && Array.isArray(tasks)){
      BASE = tasks;
    } else if(tasks && typeof tasks==='object'){
      BASE = Object.values(tasks);
    }

    // 進度更新
    CH = changes && typeof changes==='object' && !Array.isArray(changes) ? changes : {};

    // 手動新增
    MN = manuals && Array.isArray(manuals) ? manuals : (manuals?Object.values(manuals):[]);

    // META（週報、日期設定）
    META = meta || {};
    TODAY_STR = META.today || new Date().toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}).replace(/\//,'/');

    // 更新週次標題
    if(META.w1Label) document.getElementById('wt-sub-1').textContent = META.w1Label;
    if(META.w2Label) document.getElementById('wt-sub-2').textContent = META.w2Label;

    // 最後更新時間
    if(META.lastUpdate){
      document.getElementById('last-update').textContent = '· 控管表 ' + META.lastUpdate;
    }

    setSyn('ok');
  } catch(e){
    setSyn('err');
    console.error(e);
  }

  renderBoard();
}

init();
</script>
